 <html>

 <title>Number Guessing Game</title>

<body>
    <h1>Number Guessing Game</h1>
    <p>Try to guess the number between 1 and 20!</p>  
 
 <script>

   // document.write("Welcome to the Number Guessing Game!");
   // document.write("Try to guess the number between 1 and 10!");

console.log("Welcome to the Number Guessing Game!");
console.log("Try to guess the number between 1 and 20!");

 var x=10;

 while(true)
    {
    var num=prompt("Enter a number between 1 to 20");
        if(num==x)
        {                          
            alert("Congratulations! You guessed the number correctly.");
            break;
        }
        else
        {
            alert("Wrong guess.Please Try again!");
        }    
    }   
    document.write("You guessed number correctly.");        

    </script>   
</body>
</html>
